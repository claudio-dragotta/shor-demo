# Render Blueprint — demo Shor (FastAPI + Qiskit).
#
# ATTENZIONE: il servizio in produzione (shor-demo-6knp) NON e' stato creato da
# questo Blueprint, quindi Render IGNORA questo file. Verificato il 29 agosto
# 2026: portare `plan` a standard e pushare non ha spostato nulla, il servizio
# e' rimasto su 0.5c-512mb finche' non e' stato cambiato a mano dalla dashboard.
#
# Per QUEL servizio ogni impostazione si tocca dal pannello:
#   piano       -> pagina del servizio, riquadro "Compute" (non "Instance Type")
#   auto-deploy -> impostazioni di build/deploy, voce "Auto-Deploy"
#   branch      -> stesse impostazioni, appena sopra Auto-Deploy
#
# Questo file resta la descrizione versionata dell'infrastruttura, ed e' quello
# che varrebbe per chi ricreasse il servizio con Render -> New -> Blueprint.
# Va quindi tenuto allineato a cio' che e' impostato davvero nel pannello.
services:
  - type: web
    name: shor-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Esplicito di proposito: senza, Render userebbe il branch di default del
    # repository. Un branch diverso da quello su cui si pusha e' una delle
    # ragioni per cui un auto-deploy "acceso" non scatta mai.
    branch: main
    # Piani e memoria (i prezzi cambiano: verificare sulla pagina di Render):
    #   free     512 MB — si spegne dopo ~15 min di inattivita', riavvio a freddo
    #   starter  512 MB — sempre attivo, nessun cold start
    #   standard   2 GB — il primo scalino che alza davvero la memoria
    #
    # Serve "standard" perche' /api/noisy-bloch evolve la matrice densita' di 12
    # qubit (4096x4096 complessi = 268 MB di solo stato, picco misurato ~1,3 GB
    # con i buffer di Aer): sotto i 512 MB il container veniva ucciso dall'OOM e
    # cadeva tutto il sito, non solo quella richiesta. Con 2 GB il margine resta
    # circa il 25%, e regge perche' il semaforo in server.py ammette una sola
    # simulazione per volta.
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
